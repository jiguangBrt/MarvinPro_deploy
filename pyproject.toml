[project]
name = "marvinpro-deploy"
version = "0.1.0"
description = "Marvin Pro OpenPI rollout client and bidirectional ROS 2 bridge"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.10",
    "pillow>=9.0",
]

[project.scripts]
marvinpro-rollout = "marvinpro_deploy.rollout_client:main"
marvinpro-bridge = "marvinpro_deploy.robot_bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvinpro_deploy"]

[tool.ruff]
line-length = 120
target-version = "py310"
