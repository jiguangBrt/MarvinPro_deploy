[project]
name = "marvinpro-deploy"
version = "0.1.0"
description = "Marvin Pro OpenPI rollout client and bidirectional ROS 2 bridge"
requires-python = ">=3.10"
dependencies = [
    "av>=14.0; python_version >= '3.11'",
    "numpy>=1.23",
    "opencv-python>=4.10",
    "openpi-client",
    "pillow>=9.0",
    # Undeclared runtime dependency of openpi-client (websocket_client_policy
    # imports typing_extensions); declared here so the local venv is complete.
    "typing-extensions>=4.0",
]

# openpi-client is not on PyPI; it lives in the sibling OpenPI checkout on this
# deployment machine. Keep the path in sync if the checkout moves.
[tool.uv.sources]
openpi-client = { path = "../OpenPI_UR/openpi/packages/openpi-client", editable = true }

[project.scripts]
marvinpro-rollout = "marvinpro_deploy.rollout_client:main"
marvinpro-bridge = "marvinpro_deploy.robot_bridge:main"
marvinpro-gripper = "marvinpro_deploy.gripper_control:main"
marvinpro-gripper-feedback = "marvinpro_deploy.gripper_feedback_recorder:main"
marvinpro-hold-test = "marvinpro_deploy.hold_test_client:main"
marvinpro-trajectory-test = "marvinpro_deploy.trajectory_test_client:main"
marvinpro-frozen-chunk-test = "marvinpro_deploy.frozen_chunk_test_client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvinpro_deploy"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 120
target-version = "py310"
